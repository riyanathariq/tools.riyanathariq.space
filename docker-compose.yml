services:
  web:
    image: ${IMAGE:-ghcr.io/riyanathariq/tools.riyanathariq.space:latest}
    container_name: tools-riyanathariq
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    pull_policy: always
